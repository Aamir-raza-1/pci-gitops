<!DOCTYPE html>
<html>
<head>
    <title>Test Multipart</title>
</head>
<body>
    <h1>Test File Upload</h1>
    <form id="testForm">
        <input type="text" name="company_name" value="Test Company"><br>
        <input type="text" name="cloud_provider" value="gcp"><br>
        <input type="text" name="gcloud_project" value="qa-ezo"><br>
        <input type="file" name="uploaded_files" id="fileInput"><br>
        <button type="submit">Submit</button>
    </form>
    <div id="result"></div>

    <script>
    document.getElementById('testForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);

        const response = await fetch('http://localhost:8080/submit', {
            method: 'POST',
            body: formData
        });

        const html = await response.text();
        document.getElementById('result').innerHTML = html;
    });
    </script>
</body>
</html>
